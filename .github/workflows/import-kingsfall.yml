name: Import Kingsfall site (one time)
on:
  push:
    paths:
      - '.github/workflows/import-kingsfall.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out new repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Download pinned source snapshot
        env:
          SOURCE_SHA: 5900a7e8463bcea35166c606e1b465c5fe8c52e5
        run: |
          set -euo pipefail
          curl -fL --retry 3 --max-time 90             "https://codeload.github.com/navidyousefi166-maker/crownchess/zip/${SOURCE_SHA}"             -o /tmp/kingsfall-source.zip
          unzip -q /tmp/kingsfall-source.zip -d /tmp
          src="/tmp/crownchess-${SOURCE_SHA}"
          test -s "$src/index.html"
          test -s "$src/engine/stockfish-19-lite-single.wasm"
          cp "$src/index.html" ./index.html
          cp -R "$src/assets" ./assets
          cp -R "$src/engine" ./engine
          cp "$src"/humiliation-*.mp3 ./

      - name: Set new GitHub Pages home URL
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          source = 'https://navidyousefi166-maker.github.io/crownchess/'
          dest = 'https://kingsfallchess.github.io/'
          data = p.read_text(encoding="utf-8")
          assert data.count(source) == 1, "Unexpected old URL occurrences"
          p.write_text(data.replace(source, dest), encoding="utf-8")
          PY

      - name: Commit imported website
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets engine humiliation-*.mp3
          git diff --cached --quiet && exit 0
          git commit -m "Import Kingsfall website and binary assets"
          git push
