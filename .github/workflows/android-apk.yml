name: Build Kingsfall Android APK
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android-app/**'
      - 'assets/music/**'
      - '.github/workflows/android-apk.yml'
  push:
    branches:
      - main
      - feature/android-kingsfall-app
      - release/bazaar-1.4.0
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble debug APK
        working-directory: android-app
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: KingsfallChess-Android-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Assemble unsigned release APK
        working-directory: android-app
        run: gradle :app:assembleRelease --no-daemon
      - name: Check bundled music
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path
          path = next(Path("android-app/app/build/outputs/apk/release").glob("*.apk"))
          with zipfile.ZipFile(path) as z:
              tracks = [i for i in z.infolist() if i.filename.startswith("assets/music/") and i.filename.endswith(".mp3")]
              assert len(tracks) == 13, len(tracks)
              assert all(i.compress_type == zipfile.ZIP_STORED and i.file_size > 1024 for i in tracks)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: KingsfallChess-unsigned-release
          path: android-app/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
