name: Build Kingsfall Android APK
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'
  push:
    branches:
      - main
      - feature/android-kingsfall-app
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore exact offline assets from verified 1.3.2 APK
        run: |
          git fetch --no-tags --depth=1 origin 90ea8806bdb866db20d1eb919342768a130e1718
          git show FETCH_HEAD:KingsfallChess-v1.3.2.apk > /tmp/kingsfall-1.3.2.apk
          test "$(git hash-object /tmp/kingsfall-1.3.2.apk)" = "951d1874afcb68e26a56966bafa5661283078a81"
          unzip -q -o /tmp/kingsfall-1.3.2.apk 'assets/offline/*' 'assets/analysis-book.js' 'assets/openings-v1.json' -d /tmp/kf-old-assets
          cd /tmp/kf-old-assets
          sha256sum assets/offline/* assets/analysis-book.js assets/openings-v1.json
          cd -
          cp -a /tmp/kf-old-assets/assets/. android-app/app/src/main/assets/
      - name: Assemble debug APK
        working-directory: android-app
        run: gradle :app:assembleDebug --no-daemon
      - name: Assemble unsigned release APK and collect Android signing tools
        working-directory: android-app
        run: |
          gradle :app:assembleRelease --no-daemon
          mkdir -p build/release-signing
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          cp "$tools/lib/apksigner.jar" build/release-signing/
          cp "$tools/zipalign" build/release-signing/
          cp app/build/outputs/apk/release/app-release-unsigned.apk build/release-signing/
      - uses: actions/upload-artifact@v4
        with:
          name: KingsfallChess-unsigned-release
          path: android-app/build/release-signing/
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: KingsfallChess-Android-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
